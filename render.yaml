services:
  - type: web
    name: fullstock-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: ./
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: FULLSTOCK_ADMIN_SETUP_KEY
        sync: false
      - key: APP_URL
        value: https://fullstock-api-rwup.onrender.com
      - key: FRONTEND_URL
        value: https://fullstock-frontend-lj4n.onrender.com
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: fullstock-db
          property: connectionString
      - key: LOG_LEVEL
        value: warning
      - key: MAIL_MAILER
        value: log

  - type: web
    name: fullstock-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://fullstock-api-rwup.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: fullstock-db
    plan: free
    region: singapore
    databaseName: fullstock
    user: fullstock
